[package]
name = "agentnet-daemon"
description = "AgentNet daemon: config, data-dir lock, control and event socket, socket client, webhook dispatcher, HTTP MCP wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agentnet-core.workspace = true
agentnet-mcp.workspace = true
agentnet-transport = { workspace = true, features = ["logos-rest", "waku-native"] }
async-trait.workspace = true
fs4 = { version = "0.13", features = ["sync"] }
getrandom = "0.4"
hmac = "0.12"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = "0.9"
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tempfile = "3"

[[example]]
name = "mock_harness"
path = "examples/mock_harness.rs"

[[example]]
name = "embed"
path = "examples/embed.rs"

[lints]
workspace = true
