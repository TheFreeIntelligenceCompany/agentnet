# cargo-deny configuration for the AgentNet workspace.
# Run: `cargo deny check` (CI uses EmbarkStudios/cargo-deny-action; UNTESTED on GitHub). Verified locally with
# cargo-deny 0.22.1, output in results/adr0004/cargo-deny.txt.
#
# Every allowance below is justified in docs/dependency-audit.md and docs/licensing.md. Keep them in sync.

[graph]
# The project is Unix only (README "Limitations"). Restricting the targets keeps Windows-only and
# wasm-only crates in Cargo.lock (windows-sys, sqlite-wasm-rs, wasm-bindgen, ...) out of the checks.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
# Advisory database as fetched at check time. One advisory is ignored, with justification:
#  RUSTSEC-2026-0387 (crypto-bigint 0.5.5, timing variability in constant-time integer operations).
#  Path: crypto-bigint <- elliptic-curve <- p256 <- {age 0.12.1, hpke 0.12.0}. These are pulled in only through
#  the `age` crate (used for the passphrase-encrypted identity export, scrypt recipient only) and age's own
#  `hpke 0.12.0`. AgentNet's message protection is OpenPGP (Sequoia, OpenSSL backend); it does not use
#  hpke, P-256 or crypto-bigint.
#  Whether the P-256 code in age is reachable from the scrypt-only export path was read from the code, not tested.
#  No fixed version is reachable: elliptic-curve 0.13.8 requires crypto-bigint ^0.5. Revisit when age updates.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "only via age -> p256 -> elliptic-curve; agentnet uses age scrypt recipients only; no semver-compatible fix" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Allow list is the set of permissive licences present in the dependency graph for the targets above.
# Anything else fails the check. Copyleft is NOT in this list: the two LGPL crates required by Sequoia are
# admitted one by one in the exceptions below (docs/licensing.md, ADR 0004).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
]

# ADR 0004 (owner decision): sequoia-openpgp 2.5.0 and its dependency buffered-reader 1.4.1 are
# LGPL-2.0-or-later. The exceptions are pinned to exact versions so that a version bump re-opens the review.
# Licence text read from the crates' LICENSE.txt; the obligations are in docs/licensing.md.
[[licenses.exceptions]]
crate = "sequoia-openpgp@2.5.0"
allow = ["LGPL-2.0-or-later"]

[[licenses.exceptions]]
crate = "buffered-reader@1.4.1"
allow = ["LGPL-2.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# TLS is rustls (via reqwest) and SQLite is bundled; OpenSSL is not used for TLS.
# ADR 0004: Sequoia's `crypto-openssl` backend links OpenSSL 3 (through `ossl` -> `openssl-sys`), so `openssl-sys`
# is allowed ONLY when its direct dependents are `ossl` and `sequoia-openpgp`. Any other dependent, and the
# `openssl` and `native-tls` crates at all, still fail the check.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys", wrappers = ["ossl", "sequoia-openpgp"] },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
