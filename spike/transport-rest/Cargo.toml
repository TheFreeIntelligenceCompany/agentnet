[package]
name = "transport-rest-probe"
version = "0.0.1"
edition = "2021"
publish = false
description = "Spike A1 path (3): probe a local Logos Delivery (nwaku) topology through its REST API. Localhost/container-network only."

# Standalone crate: keep it out of any parent workspace.
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = 2
