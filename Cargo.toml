[workspace]
resolver = "2"
members = ["crates/transport", "crates/core", "crates/mcp", "crates/daemon", "crates/cli", "tests/acceptance"]
exclude = ["spike", "upstream", "tests/interop-rpgp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/thefreeintelligencecompany/agentnet"
publish = false

[workspace.dependencies]
agentnet-transport = { path = "crates/transport", default-features = false }
agentnet-core = { path = "crates/core" }
agentnet-mcp = { path = "crates/mcp" }
agentnet-daemon = { path = "crates/daemon" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs", "process"] }
tracing = "0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
url = "2.5"
rusqlite = { version = "0.42", features = ["bundled"] }
tokio-util = "0.7"
futures = "0.3"
prost = "0.14"
libp2p = { version = "0.57.1", default-features = false, features = ["tokio", "tcp", "dns", "noise", "yamux", "identify", "ping", "gossipsub", "request-response", "macros", "ed25519", "secp256k1"] }
libp2p-allow-block-list = "0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
