[package]
name = "agentnet-acceptance"
description = "Driver for scripts/acceptance.sh: MCP stdio client, event-log and inbox dumps, benchmark. Needs the relay topology in spike/relay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentnet-acceptance"
path = "src/main.rs"

[dependencies]
agentnet-core.workspace = true
agentnet-daemon.workspace = true
anyhow = "1"
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "server", "macros", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
