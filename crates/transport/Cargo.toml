[package]
name = "agentnet-transport"
description = "AgentNet transport interface, deterministic mock, and Logos Delivery REST adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["logos-rest"]
# Adapter to a separately running Logos Delivery node over its REST API.
# Compiles the relay tests that restart/stop containers of spike/relay (still #[ignore]d and env-gated).
disruptive-tests = ["logos-rest"]
logos-rest = ["dep:reqwest", "dep:base64", "dep:url", "dep:serde_json", "dep:tokio"]
# Pure-Rust libp2p Waku v2 (Relay + Metadata + Store v3) client transport and standalone relay (no Docker).
waku-native = [
    "dep:libp2p",
    "dep:libp2p-allow-block-list",
    "dep:prost",
    "dep:futures",
    "dep:rusqlite",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
]

[dependencies]
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
sha2.workspace = true
reqwest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
libp2p = { workspace = true, optional = true }
libp2p-allow-block-list = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64.workspace = true
tempfile = "3"

[lints]
workspace = true
