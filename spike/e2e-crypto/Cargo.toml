[package]
name = "e2e-crypto"
version = "0.0.1"
edition = "2021"
publish = false
description = "Spike A2/B1: HPKE(base)+Ed25519 envelope over the local Logos Delivery REST relay. Disposable. Localhost/container network only."

# Standalone crate: keep it out of any parent workspace.
[workspace]

[dependencies]
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
ed25519-dalek = "3"
sha2 = "0.11"
getrandom = "0.4"
data-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
