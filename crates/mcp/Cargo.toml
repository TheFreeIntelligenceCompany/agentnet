[package]
name = "agentnet-mcp"
description = "AgentNet MCP server: rmcp tools, resources and subscriptions over AgentApi (stdio and loopback Streamable HTTP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agentnet-core.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Server side only: no client, no reqwest, no OAuth.
rmcp = { version = "=3.11.0", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
serde.workspace = true
serde_json.workspace = true
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true

[dev-dependencies]
anyhow = "1"
async-trait.workspace = true
# Test client: the same pinned rmcp with client transports added.
rmcp = { version = "=3.11.0", default-features = false, features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
jsonschema = { version = "0.63", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
