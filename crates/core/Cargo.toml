[package]
name = "agentnet-core"
description = "AgentNet core: identities, contact records, sealed envelopes, durable inbox/outbox, triggers and events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Every dependency on the cryptographic path is pinned exactly (owner condition 8).
# Transitive crypto crates (curve25519-dalek, x25519-dalek, chacha20poly1305, hkdf, ...) are
# pinned by the committed Cargo.lock; CI builds with --locked.
agentnet-transport.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
sha2.workspace = true
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
data-encoding = "=2.11.1"
zeroize = "=1.9.2"
uuid = { version = "=1.29.3", default-features = false }
rusqlite.workspace = true
tokio-util.workspace = true
age = { version = "=0.12.1", default-features = false, features = ["armor"] }

[features]
# Exposes `envelope::testing` (malformed/forwarded frame builders) to integration tests.
test-support = []

[dev-dependencies]
agentnet-core = { path = ".", features = ["test-support"] }
proptest = "1"
tempfile = "3"

[lints]
workspace = true
